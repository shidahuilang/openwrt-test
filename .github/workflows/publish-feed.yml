# ============================================================
# GitHub Actions:构建 opkg 软件源并发布到 GitHub Pages
# ------------------------------------------------------------
# 模式 sample(默认):生成测试用假 ipk,端到端验证 源发布→Pages→opkg 链路
# 模式 real:从 GitHub Artifact 下载真实编译产物(bin/packages 打包)发布
# 发布位置:gh-pages 分支 → https://shidahuilang.github.io/openwrt-test/
# opkg 源地址:https://shidahuilang.github.io/openwrt-test/<架构>/<feed名>
# ============================================================
name: Publish Feed

on:
  workflow_dispatch:
    inputs:
      MODE:
        description: '运行模式'
        required: true
        default: 'sample'
        type: choice
        options:
          - 'sample'
          - 'real'
      ARCH:
        description: '架构(x86_64/aarch64_generic等)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'
          - 'aarch64_generic'
          - 'aarch64_cortex-a53'
          - 'aarch64_cortex-a72'
          - 'arm_cortex-a7_neon-vfpv4'
          - 'mipsel_24kc'

permissions:
  contents: write   # 推送 gh-pages 分支

env:
  FEED_ARCH: ${{ github.event.inputs.ARCH || 'x86_64' }}

jobs:
  publish:
    name: 构建${{ github.event.inputs.MODE == 'real' && '真实' || '测试样本' }}软件源
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 zstd(部分新版 ipk 的 control 用 zst 压缩)
        run: sudo apt-get -qq update && sudo apt-get -qq install -y zstd

      # ---------- sample 模式:造假 ipk 验证整条链路 ----------
      - name: 生成测试样本 ipk
        if: github.event.inputs.MODE != 'real'
        run: |
          mkdir -p /tmp/fakefeed/x86_64/{base,luci}
          cd /tmp/fakefeed
          make_fake_ipk() {
            local dir=$1 name=$2 ver=$3 arch=$4 desc=$5
            rm -rf stage && mkdir -p stage/CONTROL stage/data/usr/bin
            printf 'Package: %s\nVersion: %s\nArchitecture: %s\nDepends: libc\nMaintainer: shidahuilang\nDescription: %s\n' \
              "$name" "$ver" "$arch" "$desc" > stage/CONTROL/control
            echo "#!/bin/sh" > stage/data/usr/bin/"$name"
            chmod +x stage/data/usr/bin/"$name"
            tar -czf control.tar.gz -C stage/CONTROL .
            tar -czf data.tar.gz -C stage/data .
            echo "2.0" > debian-binary
            ar rc "${name}_${ver}_${arch}.ipk" debian-binary control.tar.gz data.tar.gz
            mkdir -p "$(dirname "$dir")"
            mv "${name}_${ver}_${arch}.ipk" "$dir/"
          }
          make_fake_ipk /tmp/fakefeed/x86_64/base  hello-test     1.0.0 x86_64 "测试包:验证自建软件源链路"
          make_fake_ipk /tmp/fakefeed/x86_64/base  demo-tool      1.0.1 x86_64 "测试包:演示多包索引"
          make_fake_ipk /tmp/fakefeed/x86_64/luci  luci-app-demo  1.0.0 x86_64 "测试包:LuCI界面示例"
          echo "样本就绪:" && find /tmp/fakefeed -name "*.ipk"

      - name: 整理发布结构并生成索引(sample)
        if: github.event.inputs.MODE != 'real'
        run: |
          chmod +x scripts/feed/*.sh
          bash scripts/feed/build-feed.sh /tmp/fakefeed /tmp/feedout "$FEED_ARCH"

      # ---------- real 模式:从 Artifact 取真实编译产物 ----------
      - name: 下载真实编译产物 Artifact
        if: github.event.inputs.MODE == 'real'
        uses: actions/download-artifact@v4
        with:
          name: packages-${{ env.FEED_ARCH }}
          path: /tmp/pkgsrc

      - name: 整理发布结构并生成索引(real)
        if: github.event.inputs.MODE == 'real'
        run: |
          chmod +x scripts/feed/*.sh
          bash scripts/feed/build-feed.sh /tmp/pkgsrc /tmp/feedout "$FEED_ARCH"

      - name: 校验索引格式(opkg 可解析性抽查)
        run: |
          errors=0
          while read -r f; do
            echo "== $f =="
            grep -q "^Package:" "$f" || { echo "缺少 Package 字段"; errors=$((errors+1)); }
            grep -q "^Filename:" "$f" || { echo "缺少 Filename 字段"; errors=$((errors+1)); }
            grep -q "^SHA256sum:" "$f" || { echo "缺少 SHA256sum 字段"; errors=$((errors+1)); }
            # 校验 Filename 指向的文件存在
            while read -r fn; do
              d=$(dirname "$f")
              [ -f "$d/$fn" ] || { echo "索引引用缺失: $fn"; errors=$((errors+1)); }
            done < <(grep "^Filename:" "$f" | awk '{print $2}')
          done < <(find /tmp/feedout -name "Packages")
          [ "$errors" -eq 0 ] && echo "索引校验全部通过" || { echo "发现 $errors 处错误"; exit 1; }

      # ---------- 发布到 gh-pages ----------
      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/feedout
          keep_files: false
          force_orphan: true
          commit_message: "发布软件源 ${{ env.FEED_ARCH }} (${{ github.event.inputs.MODE || 'sample' }})"

      - name: 等待 Pages 部署并验证可访问
        run: |
          url="https://shidahuilang.github.io/openwrt-test/$FEED_ARCH/base/Packages"
          echo "轮询验证: $url"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Pages 部署成功(HTTP 200)"
              echo "--- 索引内容预览 ---"
              curl -s "$url" | head -20
              exit 0
            fi
            echo "第 $i 次: HTTP $code,等待 20 秒..."
            sleep 20
          done
          echo "⚠️ 10 分钟内 Pages 未生效,请稍后手动检查仓库 Settings→Pages"
          exit 0
