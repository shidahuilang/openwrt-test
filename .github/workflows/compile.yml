#
# 编译主程序,请勿修改文件名称（compile.yml）
#


name: 编译主程序
on:
  push:
    branches:
      - main
    paths:
      - 'build/Lede/relevance/start'

env:
  GITHUB_LINK: https://github.com/${{github.repository}}
  GIT_ACTOR: ${{github.actor}}
  GIT_REPOSITORY: ${{github.repository}}
  RUN_NUMBER: ${{github.run_number}}
  RUN_WORKFLOW: ${{github.workflow}}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  WX_TOKEN: ${{ secrets.WX_TOKEN }}
  CURL: ${{ secrets.CURL }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译 "${{matrix.target}}"
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    
    env:
      FOLDER_NAME: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [Lede]

    steps:    
        
    - name: 准备结束
      uses: actions/checkout@v4


    - name: 检测文件和对比上游版本
      run: |
        cd ${GITHUB_WORKSPACE}
        bash common/custom/first.sh
        if [[ -n "${{ github.event.workflow }}" ]] || [[ -n "${{ github.event.schedule }}" ]]; then
          source ${GITHUB_WORKSPACE}/build/${FOLDER_NAME}/settings.ini
        else
          source ${GITHUB_WORKSPACE}/build/${FOLDER_NAME}/relevance/settings.ini
        fi
        source ${GITHUB_WORKSPACE}/build/${{ env.FOLDER_NAME }}/common.sh && Diy_menu1

    - name: 清理因转换CPU而停止的工作流程
      run: |
        cd ${GITHUB_WORKSPACE}
        source build/${FOLDER_NAME}/common.sh && Diy_delruns

    - name: CPU检测
      run: |
        cd ${GITHUB_WORKSPACE}
        source build/${FOLDER_NAME}/common.sh && CPU_Priority
        
    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false
        
    - name: 部署编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        source ${GITHUB_WORKSPACE}/build/${{matrix.target}}/common.sh && Diy_update
        sudo timedatectl set-timezone "$TZ"
        # 安装pyelftools模块，用于u-boot编译
        pip3 install pyelftools        
        
    - name: Create simulated physical disk
      run: |
        mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
        root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
        sudo truncate -s "${mnt_size}"G /mnt/mnt.img
        sudo truncate -s "${root_size}"G /root.img
        sudo losetup /dev/loop6 /mnt/mnt.img
        sudo losetup /dev/loop7 /root.img
        sudo pvcreate /dev/loop6
        sudo pvcreate /dev/loop7
        sudo vgcreate github /dev/loop6 /dev/loop7
        sudo lvcreate -n runner -l 100%FREE github
        sudo mkfs.xfs /dev/github/runner
        sudo mkdir -p /${{ env.DIY_WORK }}
        sudo mount /dev/github/runner /${{ env.DIY_WORK }}
        sudo chown ${USER}:${GROUPS} /${{ env.DIY_WORK }}
        df -Th

    #- name: 升级rustc到1.70.0
      #run: |
                #curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.70.0
                #source $HOME/.cargo/env
                
    - name: 下载"${{matrix.target}}"源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sf /${{ env.DIY_WORK }}/openwrt ${GITHUB_WORKSPACE}/openwrt
        cp -Rf ${GITHUB_WORKSPACE}/build ${GITHUB_WORKSPACE}/openwrt/build
        # 复制共用文件(motd/profile 等)到源码 files 目录,消除 4 源码重复
        if [[ -d ${GITHUB_WORKSPACE}/build/shared/files ]]; then
          mkdir -p ${GITHUB_WORKSPACE}/openwrt/build/${SOURCE_CODE,,}/files 2>/dev/null || true
          cp -Rf ${GITHUB_WORKSPACE}/build/shared/files/* ${GITHUB_WORKSPACE}/openwrt/build/${SOURCE_CODE,,}/files/ 2>/dev/null || true
        fi
        chmod -R +x ${GITHUB_WORKSPACE}/openwrt/build

    - name: 修改 feeds.conf.default
      run: |
        cd openwrt
        echo "当前 SOURCE_CODE 值是: $SOURCE_CODE"
        # 判断是否为 COOLSNOWWOLF 编译
        if [ "$SOURCE_CODE" == "COOLSNOWWOLF" ]; then
          echo "正在编译 COOLSNOWWOLF，启用 luci feed"
          # 使用 sed 修改 feeds.conf.default 文件
          sed -i 's@src-git luci@# src-git luci@g' feeds.conf.default
          sed -i 's@## src-git luci@src-git luci@g' feeds.conf.default
        elif [ "$SOURCE_CODE" == "IMMORTALWRT" ]; then
          echo "当前是 IMMORTALWRT 编译，跳过 luci feed 配置"
        else
          echo "未检测到 COOLSNOWWOLF 或 IMMORTALWRT 编译，跳过 luci feed 配置"
        fi

        
    - name: 公 告
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu2
 
    - name: 更新插件源
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu3
 
    - name: 加载自定义设置
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu4
        
    - name: 安装插件源
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu5

    - name: 生成"${{matrix.target}}"配置文件
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu6
        
    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_xinxi
        
    - name: 缓存加速
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: stupidloud/cachewrtbuild@v1.9.0
      with:
        ccache: 'false'
        mixkey: "${{ env.TARGET_PROFILE }}"
        prefix: ${{ github.workspace }}/openwrt
        
    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j16
    
    - name: 开始编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) + 1)) || make -j1 V=s
        echo "date=$(date "+%Y%m%d%H%M%S")" >> ${GITHUB_ENV}
        source ${BUILD_PATH}/common.sh && firmware_jiance
        
    - name: 自动打包Amlogic_Rockchip系列固件
      if: steps.compile.outcome == 'success' && env.PACKAGING_FIRMWARE == 'true'
      uses: ncipollo/release-action@v1.16.0
      with:
        name: rootfs.tar.gz
        tag: targz
        token: ${{ secrets.REPO_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
        artifacts: openwrt/targz/*rootfs.tar.gz

    - name: 整理固件文件夹(需配合diy-part.sh设定使用)
      continue-on-error: true
      if: steps.compile.outcome == 'success'
      id: organizer
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_firmware
        
    - name: 上传固件在 github Artifacts
      if: steps.compile.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4.4.3
      with:
        name: ${{ env.SOURCE }}-${{ env.LUCI_EDITION }}-${{ env.TARGET_PROFILE }}-firmware-${{ env.Firmware_Date }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: 打包全量软件包并上传(软件源发布用)
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        PKG_DIR=$(ls -d ${FIRMWARE_PATH}/../../packages/*/ 2>/dev/null | head -1)
        if [[ -n "${PKG_DIR}" ]]; then
          ARCH=$(basename "${PKG_DIR}")
          echo "FEED_ARCH=${ARCH}" >> ${GITHUB_ENV}
          cd "${PKG_DIR}.." && tar -czf "/tmp/packages-${ARCH}.tar.gz" .
          echo "上传软件包 Artifact: packages-${ARCH} ($(du -h /tmp/packages-${ARCH}.tar.gz | cut -f1))"
        else
          echo "未找到 bin/packages 目录,跳过软件源发布"
          echo "FEED_ARCH=none" >> ${GITHUB_ENV}
        fi

    - name: 上传全量软件包 Artifact
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true' && env.FEED_ARCH != 'none'
      uses: actions/upload-artifact@v4.4.3
      with:
        name: packages-${{ env.FEED_ARCH }}
        path: /tmp/packages-${{ env.FEED_ARCH }}.tar.gz
        retention-days: 3

    - name: 生成设备列表(解压 ImageBuilder → make info → JSON)
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        # 找到 ImageBuilder
        IB_FILE=$(find "${FIRMWARE_PATH}" -name "*imagebuilder*" 2>/dev/null | head -1)
        if [[ -z "${IB_FILE}" ]]; then
          echo "未找到 ImageBuilder,跳过设备列表生成"
          echo "DEVICES_GEN=false" >> ${GITHUB_ENV}
          exit 0
        fi
        echo "解压 ImageBuilder: ${IB_FILE}"
        mkdir -p /tmp/ib-devices
        tar -xJf "${IB_FILE}" -C /tmp/ib-devices
        IB_DIR=$(ls -d /tmp/ib-devices/openwrt-imagebuilder-* 2>/dev/null | head -1)
        cd "${IB_DIR}"
        # 运行 make info 并解析为 JSON
        make info > /tmp/ib-info.txt 2>&1
        # 提取 profile 列表并生成 JSON
        # ImageBuilder make info 输出格式:
        #   Target: x86
        #   Subtarget: 64
        #   Generic Profiles:
        #   generic: Generic x86/64
        #   Device Profiles:
        #   <profile>: <vendor> <model>
        # 只在 "Profiles:" 段落内解析 <name>: <desc> 行,避免误把元数据当成 profile
        python3 << 'PYEOF' || echo "解析失败,生成空列表"
        import json, re
        profiles = []
        current_target = ''
        current_subtarget = ''
        in_profiles = False
        with open('/tmp/ib-info.txt', errors='ignore') as f:
            for raw in f:
                s = raw.strip()
                if s.startswith('Target:'):
                    current_target = s.split(':', 1)[1].strip()
                    in_profiles = False
                    continue
                if s.startswith('Subtarget:'):
                    current_subtarget = s.split(':', 1)[1].strip()
                    in_profiles = False
                    continue
                if s.endswith(' Profiles:'):
                    in_profiles = True
                    continue
                if not s or s.startswith('Built-in') or s.startswith('---') or s.startswith('Packages'):
                    continue
                if in_profiles:
                    m = re.match(r'^([A-Za-z0-9][\w.,+\-]*)\s*:\s*(.*)$', s)
                    if m:
                        name = m.group(1)
                        desc = m.group(2).strip() or name
                        target_str = current_target + ('/' + current_subtarget if current_subtarget else '')
                        profiles.append({'profile': name, 'desc': desc, 'target': target_str})
        devices = {'target': current_target, 'subtarget': current_subtarget, 'profiles': profiles}
        with open('/tmp/devices.json', 'w') as f:
            json.dump(devices, f, ensure_ascii=False, indent=2)
        print('生成 %d 个设备 profile (target=%s, subtarget=%s)' % (len(profiles), current_target, current_subtarget))
        PYEOF
        if [[ ! -f /tmp/devices.json ]]; then
          echo '{"target":"","profiles":[]}' > /tmp/devices.json
        fi
        echo "DEVICES_GEN=true" >> ${GITHUB_ENV}

    - name: 上传设备列表 Artifact
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true' && env.DEVICES_GEN == 'true'
      uses: actions/upload-artifact@v4.4.3
      with:
        name: devices-${{ env.FEED_ARCH }}
        path: /tmp/devices.json
        retention-days: 3

    - name: 触发软件源自动发布(gh-pages)
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true' && env.FEED_ARCH != 'none' && env.REPO_TOKEN
      run: |
        gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-feed.yml/dispatches" \
          -f ref=main \
          -f "inputs[MODE]=real" \
          -f "inputs[ARCH]=${FEED_ARCH}" \
          -f "inputs[RUN_ID]=${{ github.run_id }}"
        echo "已触发 publish-feed (real, ${FEED_ARCH}, run=${{ github.run_id }})"
      env:
        GH_TOKEN: ${{ secrets.REPO_TOKEN }}

    - name: 发布固件
      if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true' && env.ING_FIRMWAR == 'true' && env.REPO_TOKEN
      uses: ncipollo/release-action@v1.16.0
      with:
        name: ${{ env.SOURCE }}-${{ env.PROMPT_TING }}
        tag: a${{ env.date }}
        token: ${{ secrets.REPO_TOKEN }}
        allowUpdates: true
        artifacts: "${{ env.FIRMWARE_PATH }}/*"
        body: |
          🎁 编译仓库：${{ env.WAREHOUSE_MAN }}  
          🌴 源码分支：${{ env.REPO_BRANCH }}
          🔥 编译版本：${{ env.Openwrt_Version }}
          🛸 LUCI版本：${{ env.LUCI_EDITION }}
          ✨ 内核版本：${{ env.LINUX_KERNEL }}
          ⏰ 编译时间：${{ env.Compte_Date }}
          
    - name: 发送[在线更新固件]至云端1
      id: autoup
      if: steps.compile.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true' && env.REPO_TOKEN
      uses: ncipollo/release-action@v1.16.0
      with:
        name: AutoUpdate
        tag: ${{ env.Update_tag }}
        token: ${{ secrets.REPO_TOKEN }}
        allowUpdates: true
        body: ${{ env.Tongzhi_Date }}
        artifacts: "${{ env.BIN_PATH }}/*"
        
    - name: 发送[在线更新固件]至云端2
      if: steps.autoup.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true' && env.REPO_TOKEN
      run: |
        mkdir -p Github_Api
        cd Github_Api
        curl -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.Update_tag }} -o zzz_api
        if [[ $? -ne 0 ]]; then
          curl -H "Authorization: Bearer ${REPO_TOKEN}" https://api.github.com/repos/${GIT_REPOSITORY}/releases/tags/${Update_tag} > zzz_api
        fi
        
    - name: 发送[在线更新固件]至云端3
      if: steps.autoup.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true' && env.REPO_TOKEN
      uses: ncipollo/release-action@v1.16.0
      with:
        name: AutoUpdate-${{ env.TARGET_BOARD }}
        tag: ${{ env.Update_tag }}
        token: ${{ secrets.REPO_TOKEN }}
        artifacts: "Github_Api/*"
        allowUpdates: true
        body: ${{ env.Tongzhi_Date }}

    - name: Telegram或pushplus信息通知
      if: env.PUSH_PLUS_TOKEN && env.INFORMATION_NOTICE == 'PUSH' || env.TELEGRAM_BOT_TOKEN && env.INFORMATION_NOTICE == 'TG' || env.WX_TOKEN && env.INFORMATION_NOTICE == 'WX'
      run: |
       if [[ "${{ env.INFORMATION_NOTICE }}" == "TG" ]]; then
       if [[ "${{steps.compile.outcome}}" == 'success' ]]; then
        curl -k --data chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
             --data text="🎉 主人您的${{ env.TARGET_PROFILE }}固件成功编译完成了！
             
         🎁 编译仓库：${{ env.WAREHOUSE_MAN }}  
         🌴 源码分支：${{ env.REPO_BRANCH }}
         🔥 编译版本：${{ env.Openwrt_Version }}
         🛸 LUCI版本：${{ env.LUCI_EDITION }}
         ✨ 内核版本：${{ env.LINUX_KERNEL }}
         ⏰ 编译时间：${{ env.Compte_Date }}
         ⏰ 累计编译：${{ env.RUN_NUMBER }}
         🎉 发布地址：${{ env.Github_Release }}
         🏅 固件已经编译完成 🎈！！！" \
                "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" >/dev/null 2>&1 && echo "Telegram通知成功"
       fi
       fi

       if [[ "${{ env.INFORMATION_NOTICE }}" == "PUSH" ]]; then
       if [[ "${{steps.compile.outcome}}" == 'success' ]]; then
        curl -k --data token="${{ secrets.PUSH_PLUS_TOKEN }}" \
             --data title="[${{ env.SOURCE }}-${{ env.TARGET_PROFILE }}]编译成功" \
             --data content="🎉 主人您的${{ env.FIRMWARE_MESSAGE }}固件成功编译完成了！

         🎁 编译仓库：${{ env.WAREHOUSE_MAN }}  
         🌴 源码分支：${{ env.REPO_BRANCH }}
         🔥 编译版本：${{ env.Openwrt_Version }}
         🛸 LUCI版本：${{ env.LUCI_EDITION }}
         ✨ 内核版本：${{ env.LINUX_KERNEL }}
         ⏰ 编译时间：${{ env.Compte_Date }}
         ⏰ 累计编译：${{ env.RUN_NUMBER }}
         🎉 发布地址：${{ env.Github_Release }}
         🏅 固件已经编译完成 🎈！！！" \
             "http://www.pushplus.plus/send" >/dev/null 2>&1 && echo "PUSH通知成功"
        fi
        fi

       if [[ "${{ env.INFORMATION_NOTICE }}" == "WX" ]]; then
       if [[ "${{steps.gitpush.outcome}}" == 'success' ]] && [[ "${{steps.compile.outcome}}" == 'success' ]]; then
        curl -k --data token="${{ secrets.WX_TOKEN }}" \
             --data title="编译成功" \
             --data message="🎉 主人您的${{ env.FIRMWARE_MESSAGE }}固件成功编译完成了！

         🎁 编译仓库：${{ env.WAREHOUSE_MAN }}  
         🌴 源码分支：${{ env.REPO_BRANCH }}
         🔥 编译版本：${{ env.Openwrt_Version }}
         🛸 LUCI版本：${{ env.LUCI_EDITION }}
         ✨ 内核版本：${{ env.LINUX_KERNEL }}
         ⏰ 编译时间：${{ env.Compte_Date }}
         ⏰ 累计编译：${{ env.RUN_NUMBER }}
         🎉 发布地址：${{ env.Github_Release }}
         🏅 固件已经编译完成 🎈！！！" \
             "http://${{ secrets.CURL }}/push?token=${{ secrets.WX_TOKEN }}&" >/dev/null 2>&1 && echo "WX通知成功"
       else
        curl -k --data token="${{ secrets.WX_TOKEN }}" \
             --data title="触发启动失败" \
             --data message="💥 主人❌ ：上游扩展错误或者脚本错误, 触发启动【${{ env.FOLDER_NAME }}】失败, 请点击触发脚本步骤查看详情!(${{env.Tongzhi_Date}})" \
             "http://${{ secrets.CURL }}/push?token=${{ secrets.WX_TOKEN }}&" >/dev/null 2>&1 && echo "WX通知失败"
        exit 1
       fi
       fi
