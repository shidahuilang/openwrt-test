<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenWrt 在线固件生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>OpenWrt 在线固件生成器</h1>
      <p>选设备 → 勾插件 → 一键生成定制固件（基于 ImageBuilder，无需编译）</p>
    </div>

    <!-- Token -->
    <div class="token-area">
      <label>GitHub Token</label>
      <input type="password" id="token" placeholder="ghp_xxx (需 workflow 权限,仅存本地)">
      <span class="hint">仅存浏览器 localStorage</span>
    </div>

    <!-- 设备选择 + 基本配置 -->
    <div class="config-bar">
      <div class="config-item" style="flex:2">
        <label>设备型号 (搜索选择)</label>
        <div class="device-search">
          <input type="text" id="deviceSearch" placeholder="搜索设备 (如 x86, R2S,小米,华硕...)" autocomplete="off">
          <div class="device-dropdown" id="deviceDropdown"></div>
        </div>
      </div>
      <div class="config-item">
        <label>目标架构</label>
        <select id="arch">
          <option value="x86_64">x86_64 (x86 路由器)</option>
          <option value="aarch64_generic">aarch64_generic (ARM64)</option>
        </select>
      </div>
      <div class="config-item">
        <label>固件大小 MB (0=默认,x86 建议 1024)</label>
        <input type="number" id="fwSize" value="1024" min="0">
      </div>
    </div>

    <!-- 高级配置 -->
    <div class="config-bar">
      <div class="config-item">
        <label>后台地址</label>
        <input type="text" id="lanIp" value="10.0.0.1" placeholder="10.0.0.1">
      </div>
      <div class="config-item">
        <label>后台密码</label>
        <input type="text" id="rootPwd" value="root" placeholder="root">
      </div>
      <div class="config-item">
        <label>默认主题</label>
        <select id="theme">
          <option value="">默认</option>
          <option value="luci-theme-argon">Argon</option>
          <option value="luci-theme-argon-dark">Argon Dark</option>
          <option value="luci-theme-bootstrap">Bootstrap</option>
          <option value="luci-theme-material">Material</option>
          <option value="luci-theme-openwrt-2020">OpenWrt 2020</option>
          <option value="luci-theme-kucat">KuCat</option>
          <option value="luci-theme-alpha">Alpha</option>
          <option value="luci-theme-aurora">Aurora</option>
          <option value="luci-theme-spectra">Spectra</option>
        </select>
      </div>
      <div class="config-item">
        <label>Web 服务器</label>
        <select id="webServer">
          <option value="nginx">Nginx</option>
          <option value="uhttpd">Uhttpd</option>
          <option value="lighttpd">Lighttpd</option>
        </select>
      </div>
    </div>

    <!-- 开关选项 -->
    <div class="switches">
      <label class="switch"><input type="checkbox" id="swIPv6" checked> IPv6</label>
      <label class="switch"><input type="checkbox" id="swDocker"> Docker</label>
      <label class="switch"><input type="checkbox" id="swEFI" checked> EFI 镜像</label>
      <label class="switch"><input type="checkbox" id="swLegacy"> Legacy 镜像</label>
      <label class="switch"><input type="checkbox" id="swBypass"> 旁路由模式</label>
      <label class="switch"><input type="checkbox" id="swExt4"> ext4 文件系统</label>
    </div>

    <!-- 互联网代理 -->
    <div class="proxy-section">
      <h3>代理工具</h3>
      <div class="proxy-chips">
        <label class="chip-cb"><input type="checkbox" value="luci-app-passwall" checked> PassWall</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-passwall2"> PassWall2</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-ssr-plus"> SSR-Plus</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-openclash"> OpenClash</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-homeproxy"> HomeProxy</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-nikki"> Nikki</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-nekobox"> NeKoBox</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-v2raya"> v2rayA</label>
        <label class="chip-cb"><input type="checkbox" value="luci-app-daed"> Daed</label>
        <label class="chip-cb"><input type="checkbox" value="luci-xray"> luci-xray</label>
      </div>
    </div>

    <!-- 常用插件 -->
    <div class="popular-section">
      <h3>常用插件 <span class="hint">(点击添加,更多插件请在下方搜索)</span></h3>
      <div class="popular-grid" id="popularGrid"></div>
    </div>

    <!-- 插件搜索 -->
    <div class="package-section">
      <div class="package-toolbar">
        <div class="search-box">
          <input type="text" id="search" placeholder="搜索插件 (如 passwall, clash, dns...)">
        </div>
        <div class="filter-chips">
          <span class="chip active" data-cat="all">全部</span>
          <span class="chip" data-cat="LuCI 界面">LuCI 界面</span>
          <span class="chip" data-cat="内核模块">内核模块</span>
          <span class="chip" data-cat="协议支持">协议支持</span>
          <span class="chip" data-cat="其他">其他</span>
        </div>
      </div>
      <div class="package-list" id="packageList">
        <div class="empty">正在加载插件清单...</div>
      </div>
    </div>

    <!-- 操作栏 -->
    <div class="action-bar">
      <div class="selected-info">
        已选 <span class="count" id="selCount">0</span> 个插件 /
        <span class="size" id="selSize">0B</span>
      </div>
      <button class="btn-build" id="buildBtn" disabled>生成固件</button>
    </div>

    <!-- 状态区 -->
    <div class="status-area" id="statusArea">
      <h3>构建状态</h3>
      <div id="statusSteps"></div>
      <div class="download-link" id="downloadLink"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
